<body>
    <div id="container">
        <h4 id="res">Result:</h4>

        <form onsubmit="return false" >
        <h2>Number 1:</h2>
        <input id="inp1" type="number" placeholder="Enter First Number">
        <br>
        <h2>Number 2:</h2>
        <input id="inp2" type="number" placeholder="Enter Second Number">
        <br>
        <h2>Operator</h2>
        <select name="choose" id="choose">
            <option value="">Choose Operator</option>
            <option value="Add">Add(+)</option>
            <option value="Minus">Minus(-)</option>
            <option value="Multiply">Multiply(*)</option>
            <option value="Divide">(/)</option>
        </select>
        <br>
        <br>
        
        <button onclick="calculate()">Calculate</button>
        <button type="reset">Reset</button>
        <br>
        <br>
    </form>

        <script>

            let inp1 =Number(document.getElementById("inp1"));
            let inp2= Number(document.getElementById("inp2"));
            let selected = document.getElementById("choose");
            let resultDom = document.getElementById("res");

            
            
            function calculate(){

                console.log(inp1);
                console.log(inp2);
                console.log(selected.value);
                console.log(typeof(inp1));
                console.log(typeof(inp2));
                
                
                let result ;
                
                switch(selected.value){
                    case "Minus":
                        result = inp1-inp2;
                        break;
                    case "Add":
                        result=inp1+inp2;
                        break;
                    case "Multiply":
                        result=inp1*inp2;
                        break;
                    case "Divide":
                        result=inp1/inp2;
                        break;

                }

                resultDom.innerText =`Result - ${result}`;          

            }
